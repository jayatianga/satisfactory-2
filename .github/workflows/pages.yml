name: Deploy to GitHub Pages

# Runs the simulation tests on every push, and publishes the game to GitHub
# Pages from the repository's default branch. One-time setup: Settings → Pages
# → Source: "GitHub Actions".
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tests/sim.test.mjs

  deploy:
    needs: test
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        name: Check that GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is not enabled yet::Go to Settings > Pages and set Source to 'GitHub Actions', then re-run this workflow to publish the game."
          fi
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.pages.outputs.enabled == 'true'
        name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html style.css src vendor _site/
          touch _site/.nojekyll
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
